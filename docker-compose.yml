services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: clearcut
      POSTGRES_PASSWORD: clearcut
      POSTGRES_DB: clearcut
    ports:
      - "5435:5432"
    volumes:
      - clearcut_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearcut"]
      interval: 2s
      retries: 20

  # Non-default host ports throughout, so other local projects keep theirs.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    ports:
      - "6382:6379"
    volumes:
      - clearcut_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20

  # Thumbnail cache. Console on 9003, S3 API on 9002.
  minio:
    # quay.io, not Docker Hub: minio/minio there now refuses anonymous pulls.
    image: quay.io/minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: clearcut
      MINIO_ROOT_PASSWORD: clearcut-dev-secret
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - clearcut_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      retries: 20

volumes:
  clearcut_pg:
  clearcut_redis:
  clearcut_minio:
